<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Doctors appointment form</title>
</head>
<body>
 <h1>Doctors appointment form</h1>
 <p>Fill in the following form to get a doctor's appointment </p>
 <form>
    <fieldset>
        <legend>Patient's information</legend>
    <label>Your name:</label>
    <input type ="text" id="name" placeholder="Write your whole name"><br><br>
    <label>Patient's ID</label>
    <input type="password" id="pid" placeholder="Write your secret ID"><br><br>
    <label>Your birth date</label>
    <input type="date" id="dob"><br>
    </fieldset>
    <br>
    <fieldset></fieldset>
 </form>   
</body>
</html>
