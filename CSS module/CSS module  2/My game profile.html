<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game Profile</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #16213e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            width: 380px;
        }

        h1 {
            margin-top: 0;
            color: #00fff5;
            text-align: center;
            font-size: 24px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0f3460;
            color: #00fff5;
            border: 2px solid #00fff5;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        button:hover {
            background-color: #00fff5;
            color: #16213e;
        }

        .profile-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .profile-list li {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #0f3460;
            font-size: 14px;
        }

        .profile-list li:last-child {
            border-bottom: none;
        }

        .label {
            color: #e94560;
            font-weight: 600;
        }

        .value {
            color: #ffffff;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>My Game Profile</h1>
        <button id="showBtn">Show Profile</button>

        <ul class="profile-list">
            <li><span class="label">Greeting:</span> <span class="value" id="greeting">-</span></li>
            <li><span class="label">Player Name:</span> <span class="value" id="playerName">-</span></li>
            <li><span class="label">Game:</span> <span class="value" id="game">-</span></li>
            <li><span class="label">Score:</span> <span class="value" id="score">-</span></li>
            <li><span class="label">New Record:</span> <span class="value" id="newRecord">-</span></li>
            <li><span class="label">Rank Badge:</span> <span class="value" id="rankBadge">-</span></li>
            <li><span class="label">Star Trail:</span> <span class="value" id="starTrail">-</span></li>
            <li><span class="label">Empty Slot (Null):</span> <span class="value" id="nullVal">-</span></li>
            <li><span class="label">Unassigned (Undefined):</span> <span class="value" id="undefinedVal">-</span></li>
        </ul>
    </div>

    <script>
        document.getElementById('showBtn').addEventListener('click', function() {
            // Determine time-of-day greeting
            const hours = new Date().getHours();
            let timeOfDay = "Good Evening";
            if (hours < 12) {
                timeOfDay = "Good Morning";
            } else if (hours < 18) {
                timeOfDay = "Good Afternoon";
            }

            // JavaScript variables for profile data
            const player = "ShadowNinja";
            const currentGame = "Cyber Quest";
            const currentScore = 9500;
            const isNewRecord = true;
            const rank = "Diamond 💎";
            const stars = "⭐".repeat(5);
            
            // Values demonstrating null and undefined
            const explicitNull = null;
            let unassignedValue;

            // Populating HTML elements with JavaScript values
            document.getElementById('greeting').textContent = timeOfDay + ", Gamer!";
            document.getElementById('playerName').textContent = player;
            document.getElementById('game').textContent = currentGame;
            document.getElementById('score').textContent = currentScore.toLocaleString();
            document.getElementById('newRecord').textContent = isNewRecord ? "Yes! 🎉" : "No";
            document.getElementById('rankBadge').textContent = rank;
            document.getElementById('starTrail').textContent = stars;
            document.getElementById('nullVal').textContent = String(explicitNull);
            document.getElementById('undefinedVal').textContent = String(unassignedValue);
        });
    </script>

</body>
</html>
