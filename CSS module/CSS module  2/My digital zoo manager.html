<!DOCTYPE html>
<html>
<head>
    <title>My Digital Zoo Manager - Caged Animals</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: aliceblue;
            text-align: center;
            color: #222222;
        }
        h1 {
            color: darkgreen;
        }
        #zoo {
            width: 420px;
            border: 4px solid darkgreen;
            border-radius: 12px;
            background-color: white;
            margin: 20px auto;
            padding: 15px;
        }
        /* Cage Container Styling */
        .zone {
            position: relative;
            border: 3px solid #444;
            border-radius: 8px;
            margin: 15px 10px;
            padding: 15px;
            background-color: #f0fff0;
            text-align: left;
            overflow: hidden;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.15);
        }
        /* CSS Cage Bars Overlay */
        .cage-bars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 22px,
                #333 22px,
                #333 26px
            );
            pointer-events: none;
            opacity: 0.7;
            border-bottom: 5px solid #222;
            border-top: 5px solid #222;
        }
        .animal {
            font-weight: bold;
            color: darkorange;
            font-size: 1.1em;
        }
        button {
            background-color: darkgreen;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 22px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        button:hover {
            background-color: #004d00;
        }
        #output {
            width: 420px;
            border: 2px dashed darkgreen;
            border-radius: 10px;
            background-color: #ffffff;
            margin: 20px auto;
            padding: 12px;
            text-align: left;
        }
    </style>
</head>
<body>

    <h1>My Digital Zoo Manager</h1>
    <p>Use JavaScript and the DOM to explore animals in their cages, zones, parents, children, and siblings.</p>

    <!-- Main Zoo Parent Container -->
    <div id="zoo">
        <div class="zone" id="lionZone">
            <div class="cage-bars"></div>
            <h2>Lion Cage</h2>
            <p>Animal Inside: <span class="animal">🦁 Lion</span></p>
        </div>
        <div class="zone" id="elephantZone">
            <div class="cage-bars"></div>
            <h2>Elephant Cage</h2>
            <p>Animal Inside: <span class="animal">🐘 Elephant</span></p>
        </div>
        <div class="zone" id="pandaZone">
            <div class="cage-bars"></div>
            <h2>Panda Cage</h2>
            <p>Animal Inside: <span class="animal">🐼 Panda</span></p>
        </div>
    </div>

    <button onclick="manageZoo()">Manage Zoo</button>

    <!-- Display Area for DOM Tree Output -->
    <div id="output">Zoo information will appear here.</div>

    <script>
        function manageZoo() {
            // 1. Selecting elements using DOM methods
            let zoo = document.getElementById("zoo");
            let lionZone = document.getElementById("lionZone");
            let elephantZone = document.getElementById("elephantZone");
            let pandaZone = document.getElementById("pandaZone");
            let output = document.getElementById("output");

            // 2. Finding Parent, Child, and Sibling nodes
            let parentNodeName = lionZone.parentNode.id;
            let firstChildZone = zoo.children[0].id;
            let secondChildZone = zoo.children[1].id;
            let nextSiblingZone = lionZone.nextElementSibling.id;
            let previousSiblingZone = pandaZone.previousElementSibling.id;

            // 3. Checking Types of Nodes (1 = Element, 3 = Text)
            let elementNodeType = lionZone.nodeType;
            let textNodeType = lionZone.firstChild.nodeType;

            // 4. Updating Content and Styles dynamically
            lionZone.style.backgroundColor = "#fff3cd";
            elephantZone.style.backgroundColor = "#d1ecf1";
            pandaZone.style.backgroundColor = "#f8d7da";

            lionZone.querySelector("h2").innerHTML = "Updated Lion Enclosure";
            elephantZone.querySelector("h2").innerHTML = "Updated Elephant Enclosure";
            pandaZone.querySelector("h2").innerHTML = "Updated Panda Enclosure";

            // 5. Displaying DOM inspection details on the webpage
            output.innerHTML = "<strong>DOM Tree Information:</strong><br>" +
                "Parent of Lion Zone: " + parentNodeName + "<br>" +
                "First child of Zoo: " + firstChildZone + "<br>" +
                "Second child of Zoo: " + secondChildZone + "<br><br>" +
                "<strong>Sibling Node Information:</strong><br>" +
                "Next sibling of Lion Zone: " + nextSiblingZone + "<br>" +
                "Previous sibling of Panda Zone: " + previousSiblingZone + "<br><br>" +
                "<strong>Types of Nodes:</strong><br>" +
                "Lion Zone element node type: " + elementNodeType + "<br>" +
                "Lion Zone first child text node type: " + textNodeType + "<br><br>" +
                "<strong>DOM Update:</strong><br>" +
                "The caged animal headings and background colors were updated using JavaScript.";
        }
    </script>
</body>
</html>
