<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bank App - Part 1</title>
</head>
<body>

    <!-- Main Container -->
    <div>
        <!-- Balance Display Container -->
        <div>
            <h2>Current Balance</h2>
            <div>$0.00</div>
        </div>

        <!-- Amount Input Container -->
        <div>
            <label for="amountInput">Enter Amount:</label>
            <input type="text" id="amountInput" placeholder="0.00">
        </div>

        <!-- Buttons Container -->
        <div>
            <button type="button">Deposit</button>
            <button type="button">Withdraw</button>
        </div>
    </div>

</body>
</html>
