<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucky Draw Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      margin-bottom: 8px;
      color: #4a154b;
    }

    .timer {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 25px;
      background: #f0f0f5;
      padding: 6px 12px;
      border-radius: 20px;
      display: inline-block;
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #444;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #6c5ce7;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #6c5ce7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #5a4bcf;
    }

    #result {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      font-weight: 600;
      display: none;
    }

    .win {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .lose {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .error {
      background-color: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎰 Lucky Draw</h1>
    <div class="timer">
      Time on page: <span id="time">0</span> seconds
    </div>

    <form id="drawForm">
      <div class="form-group">
        <label for="userName">Your Name</label>
        <input type="text" id="userName" placeholder="Enter your name" required>
      </div>

      <div class="form-group">
        <label for="userGuess">Guess a Number (1 to 5)</label>
        <input type="number" id="userGuess" min="1" max="5" placeholder="1-5" required>
      </div>

      <button type="button" onclick="startLuckyDraw()">Try Your Luck!</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    // --- 1. Page Duration Timer ---
    let seconds = 0;
    const timeDisplay = document.getElementById("time");

    setInterval(function() {
      seconds++;
      timeDisplay.textContent = seconds;
    }, 1000);


    // --- 2. Lucky Draw Logic & Validation ---
    function startLuckyDraw() {
      const nameInput = document.getElementById("userName").value.trim();
      const guessInput = document.getElementById("userGuess").value;
      const resultDiv = document.getElementById("result");

      // Clear previous styles/classes
      resultDiv.className = "";
      resultDiv.style.display = "block";

      // Input Validation
      if (nameInput === "") {
        resultDiv.className = "error";
        resultDiv.textContent = "Please enter your name before playing.";
        return;
      }

      const guessNum = parseInt(guessInput, 10);
      if (isNaN(guessNum) || guessNum < 1 || guessNum > 5) {
        resultDiv.className = "error";
        resultDiv.textContent = "Please enter a valid number between 1 and 5.";
        return;
      }

      // Generate Random Lucky Number between 1 and 5
      const luckyNumber = Math.floor(Math.random() * 5) + 1;

      // Check Win or Loss
      if (guessNum === luckyNumber) {
        resultDiv.className = "win";
        resultDiv.textContent = `🎉 Congratulations ${nameInput}! You guessed correctly! The lucky number was ${luckyNumber}.`;
      } else {
        resultDiv.className = "lose";
        resultDiv.textContent = `❌ Sorry ${nameInput}, you picked ${guessNum}, but the lucky number was ${luckyNumber}. Try again!`;
      }
    }
  </script>

</body>
</html>
