<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Activity: Scope of Variables in Functions</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 30px auto;
      padding: 20px;
      background-color: #f8f9fa;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      margin-right: 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background-color: #0056b3; }
    .console-log {
      background-color: #1e1e1e;
      color: #00ff66;
      font-family: monospace;
      padding: 15px;
      border-radius: 6px;
      min-height: 80px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Activity: Local vs Global Scope</h2>
    <p>Click the buttons below to trigger the function or attempt accessing variables from outside.</p>

    <!-- Interactive Controls -->
    <button onclick="runFunctionScope()">1. Run Function (Access Local Var)</button>
    <button onclick="tryAccessOutside()">2. Try Accessing Local Var Outside</button>
  </div>

  <div class="card">
    <h3>Output Window</h3>
    <div id="log" class="console-log">Output will appear here...</div>
  </div>

  <script>
    // 1. GLOBAL VARIABLE
    // Declared outside any function. Accessible everywhere in this script.
    const globalVar = "I am a GLOBAL variable. Accessible everywhere!";

    // 2. FUNCTION DEFINITION
    function runFunctionScope() {
      // LOCAL VARIABLE
      // Declared INSIDE the function. Accessible ONLY within these curly braces {}.
      const localVar = "I am a LOCAL variable. Accessible ONLY inside runFunctionScope()!";

      const logElement = document.getElementById("log");
      
      // Accessing both variables inside the function scope works!
      logElement.innerHTML = `<strong>Inside Function Execution:</strong><br>`;
      logElement.innerHTML += `• ${globalVar}<br>`;
      logElement.innerHTML += `• ${localVar}`;
    }

    // 3. OUTSIDE ACCESS DEMONSTRATION
    function tryAccessOutside() {
      const logElement = document.getElementById("log");
      logElement.innerHTML = `<strong>Outside Function Execution:</strong><br>`;
      
      // Accessing global variable works outside the function
      logElement.innerHTML += `• ${globalVar}<br>`;

      // Safely checking for the local variable outside its scope
      if (typeof localVar !== "undefined") {
        logElement.innerHTML += `• ${localVar}`;
      } else {
        logElement.innerHTML += `<span style="color: #ff6666;">• Result: 'localVar' is undefined outside its function scope!</span>`;
      }
    }
  </script>

</body>
</html>
