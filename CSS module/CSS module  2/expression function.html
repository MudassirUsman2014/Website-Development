<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Function Expression Demo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .card { background: #eef2f5; padding: 15px; border-radius: 6px; width: 300px; }
    button { margin-top: 10px; padding: 8px 12px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>JavaScript Function Expression</h2>
  <div class="card">
    <div id="result">Click the button to calculate.</div>
    <button onclick="calculateTotal()">Calculate Total</button>
  </div>

  <script>
    // 1. Store an anonymous function inside a variable
    const multiply = function(a, b) {
      return a * b;
    };

    // Function to handle the button click and use the expression
    function calculateTotal() {
      // 2. Call the function using the variable name
      const price = 25;
      const quantity = 4;
      const total = multiply(price, quantity); // Executes the function expression

      document.getElementById("result").innerHTML = 
        `<strong>Item Price:</strong> $${price}<br>` +
        `<strong>Quantity:</strong> ${quantity}<br>` +
        `<strong>Total Cost:</strong> $${total}`;
    }
  </script>

</body>
</html>
