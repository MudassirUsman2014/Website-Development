<!DOCTYPE html>
<html>
<head>
  <title>My Superhero Power Cards</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4ff;
      text-align: center;
      padding: 30px;
    }

    h1 {
      color: #ff4d4d;
    }

    p {
      color: #444444;
    }

    button {
      background-color: #ff4d4d;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #e03a3a;
    }

    .card-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .hero-card {
      background-color: white;
      border: 3px solid #ff4d4d;
      border-radius: 12px;
      width: 220px;
      padding: 18px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .hero-name {
      font-size: 22px;
      font-weight: bold;
      color: #222222;
      margin-bottom: 10px;
    }

    .hero-power {
      color: #0057b8;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .hero-mission {
      color: #666666;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>My Superhero Power Cards</h1>
  <p>Click the button to create superhero objects using JavaScript classes.</p>
  
  <button onclick="showHeroes()">Show Superheroes</button>

  <div class="card-container" id="heroCards"></div>

  <script>
    // Blueprint for creating Superhero objects
    class Superhero {
      // Constructor method to initialize properties
      constructor(name, power, mission) {
        // "this" keyword assigns values to each instance
        this.name = name;
        this.power = power;
        this.mission = mission;
      }

      // Class Method to return the HTML card structure
      describeHero() {
        return "<div class='hero-card'>" +
               "<div class='hero-name'>" + this.name + "</div>" +
               "<div class='hero-power'>Power: " + this.power + "</div>" +
               "<div class='hero-mission'>Mission: " + this.mission + "</div>" +
               "</div>";
      }
    }

    function showHeroes() {
      // Creating multiple superhero objects using the "new" keyword
      let hero1 = new Superhero("Captain Code", "Debugging errors", "Fix broken programs and save the coding world.");
      let hero2 = new Superhero("Pixel Flash", "Super speed design", "Build colourful websites in seconds.");
      let hero3 = new Superhero("Logic Girl", "Smart problem-solving", "Use logic to solve tricky challenges.");
      let hero4 = new Superhero("Data Knight", "Data protection", "Keep important information safe.");

      // Rendering cards to the DOM container
      document.getElementById("heroCards").innerHTML = 
        hero1.describeHero() + 
        hero2.describeHero() + 
        hero3.describeHero() + 
        hero4.describeHero();
    }
  </script>

</body>
</html>
