<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Event Data Viewer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000000;
      color: #fffdfd;
      text-align: center;
    }

    .event-card {
      width: 520px;
      background-color: rgb(0, 0, 0);
      border: 3px solid #3b82f6;
      border-radius: 18px;
      margin: 40px auto;
      padding: 25px;
      box-shadow: 0 0 18px #93c5fd;
    }

    h1 {
      color: #1d4ed8;
    }

    button {
      background-color: #000000;
      color: rgb(32, 237, 193);
      border: none;
      border-radius: 25px;
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #ffffff;
    }

    .info-box {
      background-color: #ffffff00;
      border: 2px dashed #60a5fa;
      border-radius: 12px;
      margin-top: 18px;
      padding: 15px;
      text-align: left;
      line-height: 1.7;
    }

    #status {
      color: #16a34a;
      font-weight: bold;
      font-size: 18px;
    }

    #jsonOutput {
      color: #7c2d12;
      font-size: 14px;
      word-wrap: break-word;
    }
  </style>
</head>
<body style="background-image:url(https://static.vecteezy.com/system/resources/thumbnails/026/757/327/small/science-seamless-pattern-with-doodles-cartoon-elements-supplies-on-white-background-for-wallpaper-wrapping-paper-stationary-prints-scrapbooking-etc-back-to-school-theme-eps-10-vector.jpg)">

  <div class="event-card">
    <h1>School Event Data Viewer</h1>
    <p>Click the button to load school event details using JSON and asynchronous JavaScript.</p>
    
    <button onclick="showSchoolEvent()">Load Event Details</button>

    <div class="info-box">
      <h2>Loading Status</h2>
      <p id="status">Waiting to load event data...</p>
    </div>

    <div class="info-box">
      <h2>Event Details</h2>
      <p id="eventDetails"></p>
    </div>

    <div class="info-box">
      <h2>JSON Text Output</h2>
      <p id="jsonOutput"></p>
    </div>
  </div>

  <script>
    // 1. Callback function to display status messages
    function showLoadingMessage(message) {
      document.getElementById("status").innerHTML = message;
    }

    // 2. Function returning a Promise to simulate server data retrieval
    function fetchSchoolEventData(callback) {
      // Execute the callback function immediately to show loading text
      callback("Loading school event data... Please wait.");

      return new Promise(function(resolve) {
        // Asynchronous delay using setTimeout()
        setTimeout(function() {
          // Object representing school event data
          let schoolEvent = {
            eventName: "Annual Science Fair",
            date: "25 October 2026",
            time: "10:00 AM",
            venue: "Bahria Auditorium",
            coordinator: "Ms. Aisha Ahmed",
            participants: 120,
            isRegistrationOpen: true
          };

          resolve(schoolEvent);
        }, 2000); // 2-second delay
      });
    }

    // 3. Main async function using async/await and JSON operations
    async function showSchoolEvent() {
      // Wait for the Promise to resolve
      let eventData = await fetchSchoolEventData(showLoadingMessage);

      // Update loading status upon completion
      document.getElementById("status").innerHTML = "Event data loaded successfully!";

      // Convert object to JSON string
      let jsonText = JSON.stringify(eventData);

      // Parse JSON string back into a JavaScript object
      let parsedEvent = JSON.parse(jsonText);

      // Format event details string
      let eventMessage = "";
      eventMessage += "Event Name: " + parsedEvent.eventName + "<br>";
      eventMessage += "Date: " + parsedEvent.date + "<br>";
      eventMessage += "Time: " + parsedEvent.time + "<br>";
      eventMessage += "Venue: " + parsedEvent.venue + "<br>";
      eventMessage += "Coordinator: " + parsedEvent.coordinator + "<br>";
      eventMessage += "Participants: " + parsedEvent.participants + "<br>";

      if (parsedEvent.isRegistrationOpen === true) {
        eventMessage += "Registration Status: Open";
      } else {
        eventMessage += "Registration Status: Closed";
      }

      // Display the final output in the DOM
      document.getElementById("eventDetails").innerHTML = eventMessage;
      document.getElementById("jsonOutput").innerHTML = jsonText;
    }
  </script>

</body>
</html>
