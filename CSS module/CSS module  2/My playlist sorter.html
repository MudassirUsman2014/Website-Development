<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Playlist Sorter</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

  <div class="container">
    <h1 class="text-center mb-4">🎵 My Playlist Sorter</h1>

    <div class="row g-4">
      
      <!-- Card 1: Sort Song Names (A-Z / Z-A) -->
      <div class="col-md-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title text-primary">Sort Songs</h5>
            <p class="card-text text-muted">Sort song titles alphabetically.</p>
            <div class="d-flex gap-2 mb-3">
              <button class="btn btn-outline-primary btn-sm w-50" onclick="sortSongsAZ()">A to Z</button>
              <button class="btn btn-outline-primary btn-sm w-50" onclick="sortSongsZA()">Z to A</button>
            </div>
            <ul class="list-group" id="songList"></ul>
          </div>
        </div>
      </div>

      <!-- Card 2: Sort Play Counts (Least/Most) -->
      <div class="col-md-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title text-success">Sort Play Counts</h5>
            <p class="card-text text-muted">Order play counts numerically.</p>
            <div class="d-flex gap-2 mb-3">
              <button class="btn btn-outline-success btn-sm w-50" onclick="sortPlaysAsc()">Least to Most</button>
              <button class="btn btn-outline-success btn-sm w-50" onclick="sortPlaysDesc()">Most to Least</button>
            </div>
            <ul class="list-group" id="playCountList"></ul>
          </div>
        </div>
      </div>

      <!-- Card 3: Label Play Counts -->
      <div class="col-md-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title text-warning">Formatted Counts</h5>
            <p class="card-text text-muted">Label every play count with 'plays'.</p>
            <button class="btn btn-warning text-white btn-sm w-100 mb-3" onclick="formatPlayCounts()">Format Play Counts</button>
            <ul class="list-group" id="formattedList"></ul>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Initial Data
    const songs = ["Bohemian Rhapsody", "Hotel California", "Imagine", "Billie Jean", "Shape of You"];
    const playCounts = [1420, 890, 2300, 450, 1850];

    // Render helper function using Array.prototype.forEach
    function renderList(elementId, items) {
      const listElement = document.getElementById(elementId);
      listElement.innerHTML = "";
      items.forEach(item => {
        const li = document.createElement("li");
        li.className = "list-group-item";
        li.textContent = item;
        listElement.appendChild(li);
      });
    }

    // Initialize default lists on page load
    renderList("songList", songs);
    renderList("playCountList", playCounts);

    // Card 1 Logic: Array.prototype.sort() and Array.prototype.reverse()
    function sortSongsAZ() {
      const sorted = [...songs].sort();
      renderList("songList", sorted);
    }

    function sortSongsZA() {
      const sorted = [...songs].sort().reverse();
      renderList("songList", sorted);
    }

    // Card 2 Logic: Numerical Sort using sort() with comparator and reverse()
    function sortPlaysAsc() {
      const sorted = [...playCounts].sort((a, b) => a - b);
      renderList("playCountList", sorted);
    }

    function sortPlaysDesc() {
      const sorted = [...playCounts].sort((a, b) => a - b).reverse();
      renderList("playCountList", sorted);
    }

    // Card 3 Logic: Array.prototype.map()
    function formatPlayCounts() {
      const formatted = playCounts.map(count => `${count.toLocaleString()} plays`);
      renderList("formattedList", formatted);
    }
  </script>

</body>
</html>
