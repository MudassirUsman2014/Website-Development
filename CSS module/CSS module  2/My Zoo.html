<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Zoo - Closed</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body id="zooBody" class="bg-light min-vh-100 d-flex align-items-center justify-content-center">

  <div class="container text-center py-5">
    <h1 class="display-4 fw-bold text-dark mb-4">Welcome to My Zoo</h1>
    
    <button id="openBtn" class="btn btn-success btn-lg shadow-sm mb-4" onclick="openZoo()">
      Open the Zoo!
    </button>

    <!-- Zoo Zones Container -->
    <div class="row justify-content-center g-3 mb-4">
      <div class="col-md-4 col-sm-6">
        <div class="card h-100 shadow-sm border-dashed p-3" id="zone1">
          <div class="card-body text-secondary fw-semibold">Empty Zone</div>
        </div>
      </div>
      <div class="col-md-4 col-sm-6">
        <div class="card h-100 shadow-sm border-dashed p-3" id="zone2">
          <div class="card-body text-secondary fw-semibold">Empty Zone</div>
        </div>
      </div>
      <div class="col-md-4 col-sm-6">
        <div class="card h-100 shadow-sm border-dashed p-3" id="zone3">
          <div class="card-body text-secondary fw-semibold">Empty Zone</div>
        </div>
      </div>
    </div>

    <!-- Status Badge -->
    <div class="d-inline-block">
      <span id="statusMessage" class="badge bg-secondary fs-5 px-4 py-2 shadow-sm">
        Total Animals: 0
      </span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
